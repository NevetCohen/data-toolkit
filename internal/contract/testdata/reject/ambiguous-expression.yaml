schema_version: v1
id: ambiguous
sources:
  - id: source
    format: csv
    location: input.csv
operations:
  - id: filter
    kind: filter
    inputs: [source]
    condition: A == B OR C == D
outputs:
  - id: output
    input: filter
    format: csv
    location: output.csv
    projection:
      - column:
          header: A
        output_as: A
interface:
  name: cli
  approval_before_run: false
exception:
  action: block
